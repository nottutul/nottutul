<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 55 290 290" width="400" height="400">
  <defs>
    <!-- Eye clip for Blue Snake: animates top edge down to y=95 for a crisp half-circle wink -->
    <clipPath id="blue-eye-mask">
      <rect x="150" y="95" width="36" height="34">
        <animate attributeName="y" dur="2.033s" repeatCount="indefinite" values="95; 95; 79; 79; 95" keyTimes="0; 0.18; 0.25; 0.90; 1" calcMode="spline" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1" />
      </rect>
    </clipPath>

    <!-- Eye clip for Yellow Snake: animates y in 180° rotated space so it blinks upside-down symmetrically with the blue snake -->
    <clipPath id="yellow-eye-mask">
      <rect x="150" y="79" width="36" height="34">
        <animate attributeName="y" dur="2.033s" repeatCount="indefinite" values="79; 79; 95; 95; 79; 79" keyTimes="0; 0.48; 0.54; 0.72; 0.79; 1" calcMode="spline" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1" />
      </rect>
    </clipPath>
  </defs>

  <!-- ================= BLUE SNAKE (TOP-LEFT) ================= -->
  <g>
    <!-- Blue Tongue: Shoots out and rapidly flicks up and down before retracting -->
    <path fill="none" stroke="#498ABA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M 155 120 L 110 120 Q 92 120 81 106">
      <animate attributeName="d" dur="2.033s" repeatCount="indefinite" values="
          M 155 120 L 110 120 Q 92 120 81 106;
          M 155 120 L 110 120 Q 92 120 81 132;
          M 155 120 L 110 120 Q 92 120 81 106;
          M 155 120 L 110 120 Q 92 120 81 132;
          M 155 120 L 110 120 Q 92 120 81 106;
          M 155 120 L 112 120 Q 96 120 83 120;
          M 155 120 L 148 120 Q 144 120 140 120;
          M 155 120 L 148 120 Q 144 120 140 120;
          M 155 120 L 106 120 Q 92 120 77 120;
          M 155 120 L 110 120 Q 92 120 81 106" keyTimes="0; 0.045; 0.09; 0.135; 0.18; 0.22; 0.28; 0.85; 0.93; 1" calcMode="spline" keySplines="
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.2 1;
          0 0 1 1;
          0.2 0 0.2 1;
          0.4 0 0.2 1" />
    </path>

    <!-- Blue Snake Body -->
    <path fill="#498ABA" d="M 197.5 60
         C 237 60, 262 74, 262 106
         L 262 156
         A 38 38 0 0 1 224 194
         L 176 194
         A 50 50 0 0 0 126 244
         L 126 265.5
         L 108 265.5
         C 75 265.5, 63 242, 63 200
         C 63 158, 75 134.5, 108 134.5
         L 198 134.5
         L 198 125
         L 133 125
         L 133 106
         C 133 74, 158 60, 197.5 60
         Z" />

    <!-- Blue Snake Eye -->
    <circle cx="168" cy="95" r="14" fill="#ffffff" clip-path="url(#blue-eye-mask)" />
  </g>

  <!-- ================= YELLOW SNAKE (BOTTOM-RIGHT, 180° SYMMETRIC) ================= -->
  <g transform="rotate(180 200 200)">
    <!-- Yellow Tongue: Shoots out and rapidly flicks up and down before retracting -->
    <path fill="none" stroke="#FDD645" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M 155 120 L 148 120 Q 144 120 140 120">
      <animate attributeName="d" dur="2.033s" repeatCount="indefinite" values="
          M 155 120 L 148 120 Q 144 120 140 120;
          M 155 120 L 148 120 Q 144 120 140 120;
          M 155 120 L 106 120 Q 92 120 77 120;
          M 155 120 L 110 120 Q 92 120 81 132;
          M 155 120 L 110 120 Q 92 120 81 106;
          M 155 120 L 110 120 Q 92 120 81 132;
          M 155 120 L 110 120 Q 92 120 81 106;
          M 155 120 L 110 120 Q 92 120 81 132;
          M 155 120 L 112 120 Q 96 120 83 120;
          M 155 120 L 148 120 Q 144 120 140 120;
          M 155 120 L 148 120 Q 144 120 140 120" keyTimes="0; 0.41; 0.48; 0.525; 0.57; 0.615; 0.66; 0.705; 0.75; 0.82; 1" calcMode="spline" keySplines="
          0 0 1 1;
          0.2 0 0.2 1;
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.6 1;
          0.4 0 0.2 1;
          0 0 1 1" />
    </path>

    <!-- Yellow Snake Body -->
    <path fill="#FDD645" d="M 197.5 60
         C 237 60, 262 74, 262 106
         L 262 156
         A 38 38 0 0 1 224 194
         L 176 194
         A 50 50 0 0 0 126 244
         L 126 265.5
         L 108 265.5
         C 75 265.5, 63 242, 63 200
         C 63 158, 75 134.5, 108 134.5
         L 198 134.5
         L 198 125
         L 133 125
         L 133 106
         C 133 74, 158 60, 197.5 60
         Z" />

    <!-- Yellow Snake Eye -->
    <circle cx="168" cy="95" r="14" fill="#ffffff" clip-path="url(#yellow-eye-mask)" />
  </g>
</svg>
